version: '3.9'

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_API_VERSION: ${NEXT_PUBLIC_API_VERSION}
        NEXT_PUBLIC_NEXUS_URL: ${NEXT_PUBLIC_NEXUS_URL}
        NEXT_PUBLIC_WISEMENSOFT_URL: ${NEXT_PUBLIC_WISEMENSOFT_URL}
    ports:
      - '3000:3000'
    env_file:
      - .env.local
